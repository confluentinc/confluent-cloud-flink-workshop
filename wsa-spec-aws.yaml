# WSA Spec — AWS
# Workshop Setup Accelerator spec for the Confluent Cloud "Getting Started with
# Apache Flink" (marketplace) workshop.
#
# Usage:
#   op run --env-file=.env.tpl -- wsa build -w confluent-cloud-flink-workshop/wsa-spec-aws.yaml
#
# This workshop is pure Confluent Cloud + Flink: no AWS/Databricks resources and
# no shared infrastructure. Each attendee gets a fully self-contained Confluent
# Cloud environment (Kafka cluster, Schema Registry, Flink pools, and in-cluster
# Flink data-generation statements), so WSA runs a single per_account phase.
#
# The per-account Terraform lives in terraform/ (a WSA-specific tree). The
# original single-tenant demo in demo-infrastructure/ is unchanged; the reusable
# resources are factored into terraform/modules/confluent-flink-marketplace and
# consumed by the per-account root terraform/aws.

# wsa release this spec requires. Caret on a 0.x floor resolves to >=0.3.0 <0.4.0.
wsa_version: "^0.3.0"

name: confluent-flink-marketplace-aws
description: Confluent Cloud + Apache Flink — Getting Started (marketplace) on AWS
cloud: AWS

# Number of workshop accounts to provision (e.g. tmm+wp1 .. tmm+wp95).
# Dry-run friendly default; raise for the real event.
account_count: 2

# Account identity (email pattern) is operator config: set WSA_EMAIL_PATTERN in
# wsa.env (e.g. WSA_EMAIL_PATTERN=tmm+wp{N}@confluent.io). {email}/{N}/{NNN}
# tokens below resolve through it.

# Terraform source — when omitted, wsa uses the local terraform tree relative to
# this spec file. Uncomment to have wsa clone the repo at runtime instead.
# terraform_repo: https://github.com/confluentinc/confluent-cloud-flink-workshop
# terraform_ref: main

# Terraform phases — applied in declaration order, destroyed in reverse.
# A single per_account phase: one apply per attendee, parallel workspaces.
phases:
  - name: accounts
    scope: per_account
    path: terraform/aws/

# No `isolation:` block. Confluent Cloud environment creation and attendee
# EnvironmentAdmin RBAC are handled directly by the per-account Terraform
# (confluent_environment + confluent_role_binding on confluent_cloud_email),
# not by wsa's built-in isolation mechanism.

# No `data_generation:` block. Data is generated by Flink statements that run
# inside each attendee's own environment (terraform/modules/.../statements/),
# not by an external generator that wsa would stage.

# Variables passed to the workshop Terraform via -var flags.
# When set, ONLY these variables are passed. Template tokens expand per-account:
#   {email} — attendee email;  {N} — 1,2,…;  {NNN} — 001,002,…
terraform_vars:
  confluent_cloud_email: "{email}"
  prefix: "wp{NNN}"
  cloud_region: "us-east-2"

# Terraform providers used by this workshop (for validation)
providers:
  - name: confluent
    version: ">= 2.12"

# CLI tools required on the operator's machine (for validation)
tools_required:
  - name: terraform
    version: ">= 1.7"
  - name: git
    version: ">= 2.0"
  - name: op
    version: ">= 2.0"

# Environment variables that must be set at runtime, passed through to Terraform
# as TF_VAR_*. With `op run`, these resolve from 1Password references in .env.tpl.
env_vars:
  - TF_VAR_confluent_cloud_api_key
  - TF_VAR_confluent_cloud_api_secret

# Credential groups — columns in the CSV output and sections in the dispenser
# email. source: terraform reads a root output; spec computes from a template;
# op reads the attendee password set by `wsa reset-account-password`.
credentials:
  - name: Confluent Cloud
    fields:
      - label: URL
        source: terraform
        output: cc_environment_url
      - label: Username
        source: spec
        value: "{email}"
      - label: Password
        source: op
      - label: Environment ID
        source: terraform
        output: cc_environment_id
      - label: Environment Name
        source: terraform
        output: cc_environment_name
      - label: Flink Compute Pool ID
        source: terraform
        output: cc_flink_compute_pool_id
      - label: Kafka Cluster ID
        source: terraform
        output: cc_kafka_cluster_id
      - label: Kafka Bootstrap
        source: terraform
        output: cc_kafka_bootstrap_endpoint
